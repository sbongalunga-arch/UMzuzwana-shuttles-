<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMzuzwana Shuttles</title> 
  <style><img src="YOUR-LOGO-LINK-HERE" alt="UMzuzwana Shuttles Logo" style="max-width:180px; display:block; margin:20px auto;">
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      background: linear-gradient(135deg, #f4f4f4, #e9ecef);
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-circle {
      width: 70px;
      height: 70px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: #222;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      margin: 0;
      color: #222;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-top: 7px;
      margin-bottom: 25px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 16px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      background: #fafafa;
    }

    input:focus {
      outline: none;
      border-color: #222;
      background: white;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 15px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #444;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #message {
      margin-top: 20px;
      text-align: center;
      font-weight: bold;
    }
  </style></head><body>  <div class="container"><div class="logo-area">
  <div class="logo-circle">US</div>
  <h1>UMzuzwana Shuttles</h1>
  <div class="subtitle">Reliable Shuttle Transportation</div>
</div>

<form id="bookingForm">

  <label for="name">Name</label>
  <input type="text" id="name" name="name" required>

  <label for="pickup">Pickup</label>
  <input type="text" id="pickup" name="pickup" required>

  <label for="destination">Destination</label>
  <input type="text" id="destination" name="destination" required>

  <label for="date">Date</label>
  <input type="date" id="date" name="date" required>

  <label for="time">Time</label>
  <input type="time" id="time" name="time" required>

  <button type="submit" id="submitButton">
    Book Shuttle
  </button>

</form>

<div id="message"></div>

  </div>  <script>
    document.getElementById("bookingForm").addEventListener("submit", async function(event) {
      event.preventDefault();

      const message = document.getElementById("message");
      const button = document.getElementById("submitButton");

      const booking = {
        name: document.getElementById("name").value,
        pickup: document.getElementById("pickup").value,
        destination: document.getElementById("destination").value,
        date: document.getElementById("date").value,
        time: document.getElementById("time").value
      };

      message.textContent = "Sending booking...";
      button.disabled = true;

      try {
        const response = await fetch("/book", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(booking)
        });

        const result = await response.json();

        if (result.success) {
          message.textContent = "Booking sent successfully!";
          document.getElementById("bookingForm").reset();
        } else {
          message.textContent = result.message || "Unable to send booking.";
        }

      } catch (error) {
        message.textContent = "Unable to send booking. Please try again.";
      }

      button.disabled = false;
    });
  </script></body>
</html>
